spring:
  servlet:
    multipart:
      max-file-size: 10MB
  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: test
        endpoint: http://localhost:9000
        path-style-access-enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cloudfront:
  domain: cloudfront.net

logging:
  level:
    org.springframework.boot: info
    org.springframework.web: info
    org.hibernate.SQL: info