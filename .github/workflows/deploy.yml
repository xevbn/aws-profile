name: CI CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 커밋 해시 추출
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # 3. Java 17 설치
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      # 4. Gradle 캐시
      - name: Cache Gradle package
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. 권한 추가
      - name: Make executable
        run: chmod +x ./gradlew

      # 6. 테스트 실행
      - name: Run tests
        run: ./gradlew test

      # 7. JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar

      # 8. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 9. Docker 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 10. Docker 이미지 빌드 및 Docker Hub에 Push
      - name: Build and push Docker Image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}
          platforms: linux/arm64, linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # AWS 자격증명 구성
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Parameter store의 이미지 태그 수정
      - name: Update image tag
        run: |
          aws ssm put-parameter \
            --name "/my-app/image-tag" \
            --value "${{ github.sha }}" \
            --type String \
            --overwrite

      # AGS의 인스턴스 업데이트
      - name: Start Instance Refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ secrets.AWS_ASG_NAME }}" \
            --preferences '{
              "InstanceWarmup":300,
              "MinHealthyPercentage":100
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT

      - name: Wait for Instance Refresh
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ secrets.AWS_ASG_NAME }}" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ secrets.AWS_ASG_NAME }}" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Status: $STATUS ($PERCENT%)"

            if [ "$STATUS" = "Successful" ]; then
              echo "✅ Rolling deployment completed successfully."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Rolling deployment failed."
              exit 1
            fi

            sleep 20
          done